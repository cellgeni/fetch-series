site_name: fetch-series knowledge base
site_description: Routes between public sequencing accessions, and where the archives lose data.
repo_url: https://github.com/cellgeni/fetch-series
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight

# The knowledge base cross-references heavily by design -- a stale link is worse
# than no link -- so every link class warns and the build runs with --strict.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Routes:
      - GEO series to experiment: routes/gse-to-experiment/index.md
      - Via SOFT BioProject and ENA: routes/gse-to-experiment/soft-bioproject-ena.md
  - Pathologies:
      - Overview: pathologies/index.md
      - ELink gds to sra returns no links: pathologies/elink-gds-sra-missing-links.md
      - GEO omits the SRA relation: pathologies/geo-omits-sample-sra-relation.md
      - Shared umbrella BioProject: pathologies/series-under-shared-umbrella-bioproject.md
  - Upstream reports:
      - Overview: upstream/index.md
      - NCBI ELink gds to sra: upstream/ncbi-elink-gds-sra.md
  # Earlier exploration notes, kept because they record how each finding was
  # reached. Being superseded by the per-route pages above.
  - Archive notes:
      - Accession relationships: relationships.md
      - BioProject: bioproject.md
      - BioSamples: biosamples.md
      - BioProject to GEO troubleshooting: bioproject2geo_troubleshooting.md
