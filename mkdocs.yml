      - GEO series to GEO sample: routes/gse-to-geo-sample/soft-family.md
      - GEO series to GEO sample via gds: routes/gse-to-geo-sample/gds-summary.md
      - GEO series to experiment: routes/gse-to-experiment/index.md
      - Via SOFT BioProject and ENA: routes/gse-to-experiment/soft-bioproject-ena.md
      - GEO sample to experiment: routes/geo-sample-to-experiment/index.md
      - BioProject to run: routes/bioproject-to-run/index.md
      - BioProject to experiment: routes/bioproject-to-experiment/ena-filereport.md
      - BioProject to study: routes/bioproject-to-study/ena-filereport.md
      - Study to BioProject: routes/study-to-bioproject/ena-filereport.md
      - Study to run: routes/study-to-run/ena-filereport.md
