site_name: fetch-series knowledge base
site_description: Routes between public sequencing accessions, and where the archives lose data.
repo_url: https://github.com/cellgeni/fetch-series
# Required for the sitemap and for canonical links to resolve; Material
# also uses it to decide whether the search index can be prebuilt.
site_url: https://cellgeni.github.io/fetch-series/
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    # Top-level sections become tabs, so the sidebar shows one part of the
    # knowledge base at a time rather than all ~75 pages at once.
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  - search

# Embeds the route graph, built from fetch_series.graph.REGISTRY and the link
# catalogue, into routes/graph.md, and generates graph/catalogue.md's counts,
# mechanism table and gaps -- so both are regenerated by every build and cannot
# drift.
hooks:
  - hooks/route_graph.py

extra_css:
  - stylesheets/route-graph.css

# A no-op on every page but routes/graph.md, which it draws as plain SVG.
extra_javascript:
  - javascripts/route-graph.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight

# The knowledge base cross-references heavily by design -- a stale link is worse
# than no link -- so every link class warns and the build runs with --strict.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Five tabs. Route pages are grouped by the accession you start from, because
# that is the question a reader arrives with ("I have a GSE -- now what?").
#
# navigation.indexes is deliberately off: Material attaches *any* index.md child
# as its section's page, not just the first, and several route pages are
# index.md files inside these groups -- "From GEO" would open the
# GSE-to-experiment page.
nav:
  - Home: index.md
  - How it works:
      - The resolver: resolver.md
      - The relation table: relations.md
      - The file layer: files.md
      - The assay layer: assays.md
      - Reading the reads: inspect.md
      - The metadata layer:
          - Overview: metadata.md
          - Fields and their ontologies: metadata/fields.md
          - Sources: metadata/sources.md
      - Parity with fetch10xmeta: fetch10xmeta-parity.md
  - Routes:
      - Overview:
          - The route matrix: routes/index.md
          - Route graph: routes/graph.md
          - The link catalogue: graph/catalogue.md
          - Link survey results: graph/link-survey-results.md
          - Accession types: graph/accession-types.md
          - Routing by archive: graph/routing-by-archive.md
      - From GEO:
          - Series → BioProject (SOFT): routes/gse-to-bioproject/soft-family.md
          - Series → BioProject (gds): routes/gse-to-bioproject/gds-summary.md
          - Series → GEO sample (SOFT): routes/gse-to-geo-sample/soft-family.md
          - Series → GEO sample (gds): routes/gse-to-geo-sample/gds-summary.md
          - Series → experiment: routes/gse-to-experiment/index.md
          - Series → experiment via BioProject and ENA: routes/gse-to-experiment/soft-bioproject-ena.md
          - GEO sample → experiment: routes/geo-sample-to-experiment/index.md
      - From BioProject:
          - BioProject → run: routes/bioproject-to-run/index.md
          - BioProject → experiment: routes/bioproject-to-experiment/ena-filereport.md
          - BioProject → study: routes/bioproject-to-study/ena-filereport.md
          - BioProject → BioSample: routes/bioproject-to-biosample/index.md
          - BioProject → GEO series: routes/bioproject-to-geo-series/index.md
      - From INSDC records:
          - Study → BioProject: routes/study-to-bioproject/ena-filereport.md
          - Study → run: routes/study-to-run/ena-filereport.md
          - Sample → run: routes/sample-to-run/ena-filereport.md
          - BioSample → run: routes/biosample-to-run/ena-filereport.md
          - Experiment → run: routes/experiment-to-run/ena-filereport.md
          - Experiment → BioSample: routes/experiment-to-biosample/ena-filereport.md
          - Run → experiment: routes/run-to-experiment/ena-filereport.md
          - Run → BioSample: routes/run-to-biosample/ena-filereport.md
          - Run → GEO sample via aliases: routes/run-to-geo-sample/ena-alias.md
      - From ArrayExpress:
          - Experiment → study: routes/ae-experiment-to-study/index.md
          - Experiment → BioSample: routes/ae-experiment-to-biosample/sdrf.md
          - Study → ArrayExpress experiment: routes/study-to-ae-experiment/biostudies-search.md
      - To files:
          - Run → file: routes/run-to-file/index.md
          - ArrayExpress experiment → file: routes/ae-experiment-to-file/index.md
  - Evidence:
      - Benchmarks: benchmarks/index.md
      - Read classifier benchmark: benchmarks/inspect-2026-10.md
      - Content survey: benchmarks/content-survey-2026-10.md
      - Other technologies: benchmarks/technologies-2026-10.md
      - Against past STARsolo runs: benchmarks/inspect-vs-starsolo-2026-10.md
      - Pathologies:
          - Overview: pathologies/index.md
          - ELink gds to sra returns no links: pathologies/elink-gds-sra-missing-links.md
          - GEO omits the SRA relation: pathologies/geo-omits-sample-sra-relation.md
          - Shared umbrella BioProject: pathologies/series-under-shared-umbrella-bioproject.md
          - SOFT names experiments with no runs: pathologies/soft-names-experiments-with-no-runs.md
          - BioStudies 20,000-hit window: pathologies/biostudies-20000-hit-window.md
          - ENA fastq omits the barcode read: pathologies/ena-paired-library-single-fastq.md
          - ArrayExpress SDRF mirror URIs: pathologies/ae-sdrf-points-at-decommissioned-mirror.md
          - BioSample efetch ignores the accession prefix: pathologies/biosample-efetch-ignores-accession-prefix.md
          - ZOOMA's filter forces a term: pathologies/zooma-filter-forces-a-term.md
          - ELink MegaLink failures: pathologies/megalink-backend-flakiness.md
          - ENA fastq carries Lite qualities: pathologies/ena-fastq-is-lite-quality.md
          - ENA fastq splits through the barcode read: pathologies/ena-fastq-splits-the-barcode-read.md
          - ENA lists a fastq it does not serve: pathologies/ena-serves-a-listed-fastq-wrongly.md
          - ESummary refuses more than 500 UIDs: pathologies/esummary-500-uid-limit.md
          - SRA's ESummary buries its accessions: pathologies/esummary-sra-buries-accessions-in-expxml.md
          - An IDF does not declare its ENA study: pathologies/ae-idf-missing-secondary-accession.md
          - BioStudies lists 25 files by default: pathologies/biostudies-silent-25-item-default.md
          - A series' BioProject holds more than the series: pathologies/experiments-outside-the-series-bioproject.md
      - Upstream reports:
          - Overview: upstream/index.md
          - NCBI ELink gds to sra: upstream/ncbi-elink-gds-sra.md
          - EBI ENA derived fastq: upstream/ebi-ena-derived-fastq-drops-technical-read.md
          - EBI BioStudies search window: upstream/ebi-biostudies-search-window.md
          - EBI ArrayExpress SDRF URIs: upstream/ebi-arrayexpress-sdrf-mirror-uris.md
          - NCBI BioSample efetch prefix: upstream/ncbi-biosample-efetch-accession-prefix.md
          - DDBJ Search mirrored SRA links: upstream/ddbj-search-mirrored-sra-links.md
          - ENA listed and Lite-derived fastqs: upstream/ebi-ena-fastq-files-not-as-listed.md
      # Earlier exploration notes, kept because they record how each finding was
      # reached. Superseded by the per-route pages.
      - Archive notes:
          - Accession relationships: relationships.md
          - BioProject: bioproject.md
          - BioSamples: biosamples.md
          - BioProject to GEO troubleshooting: bioproject2geo_troubleshooting.md
  - Decisions:
      - Overview: decisions/index.md
      - How routes are ranked: decisions/route-ranking.md
      - What counts as evidence: decisions/what-counts-as-evidence.md
      - What counts as a metadata gold set: decisions/what-counts-as-a-metadata-gold-set.md
      - How values are grounded: decisions/ontology-grounding.md
      - When archives disagree: decisions/merging-and-provenance.md
      - Parity before improvement: decisions/parity-before-improvement.md
      - No DDBJ provider needed: decisions/no-ddbj-provider.md
      - ENA browser XML not needed: decisions/ena-browser-xml-not-needed.md
      - Why fetch-series reads the reads itself: decisions/why-fetch-series-reads-the-reads-itself.md
      - What a read sample can prove: decisions/what-a-read-sample-can-prove.md
