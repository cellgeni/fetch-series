site_name: fetch-series knowledge base
site_description: Routes between public sequencing accessions, and where the archives lose data.
repo_url: https://github.com/cellgeni/fetch-series
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight

# The knowledge base cross-references heavily by design -- a stale link is worse
# than no link -- so every link class warns and the build runs with --strict.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - The resolver: resolver.md
  - The relation table: relations.md
  - The file layer: files.md
  - Parity with fetch10xmeta: fetch10xmeta-parity.md
  - The graph:
      - Accession types: graph/accession-types.md
      - Routing by archive: graph/routing-by-archive.md
  - Routes:
      - GEO series to experiment: routes/gse-to-experiment/index.md
      - Via SOFT BioProject and ENA: routes/gse-to-experiment/soft-bioproject-ena.md
      - GEO sample to experiment: routes/geo-sample-to-experiment/index.md
      - BioProject to run: routes/bioproject-to-run/index.md
      - BioProject to experiment: routes/bioproject-to-experiment/ena-filereport.md
      - BioProject to GEO series: routes/bioproject-to-geo-series/index.md
      - BioProject to BioSample: routes/bioproject-to-biosample/index.md
      - ArrayExpress experiment to study: routes/ae-experiment-to-study/index.md
      - Study to ArrayExpress experiment: routes/study-to-ae-experiment/biostudies-search.md
      - Run to file: routes/run-to-file/index.md
      - ArrayExpress experiment to file: routes/ae-experiment-to-file/index.md
  - Pathologies:
      - Overview: pathologies/index.md
      - ELink gds to sra returns no links: pathologies/elink-gds-sra-missing-links.md
      - GEO omits the SRA relation: pathologies/geo-omits-sample-sra-relation.md
      - Shared umbrella BioProject: pathologies/series-under-shared-umbrella-bioproject.md
      - SOFT names experiments with no runs: pathologies/soft-names-experiments-with-no-runs.md
      - BioStudies 20,000-hit window: pathologies/biostudies-20000-hit-window.md
      - ENA unpaired fastq for a paired library: pathologies/ena-paired-library-single-fastq.md
      - ArrayExpress SDRF mirror URIs: pathologies/ae-sdrf-points-at-decommissioned-mirror.md
  - Benchmarks: benchmarks/index.md
  - Upstream reports:
      - Overview: upstream/index.md
      - NCBI ELink gds to sra: upstream/ncbi-elink-gds-sra.md
  # Earlier exploration notes, kept because they record how each finding was
  # reached. Being superseded by the per-route pages above.
  - Archive notes:
      - Accession relationships: relationships.md
      - BioProject: bioproject.md
      - BioSamples: biosamples.md
      - BioProject to GEO troubleshooting: bioproject2geo_troubleshooting.md
