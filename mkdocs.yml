site_name: fetch-series knowledge base
site_description: Routes between public sequencing accessions, and where the archives lose data.
repo_url: https://github.com/cellgeni/fetch-series
# Required for the sitemap and for canonical links to resolve; Material
# also uses it to decide whether the search index can be prebuilt.
site_url: https://cellgeni.github.io/fetch-series/
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight

# The knowledge base cross-references heavily by design -- a stale link is worse
# than no link -- so every link class warns and the build runs with --strict.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
