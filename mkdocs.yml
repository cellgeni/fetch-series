      - Sources: metadata/sources.md
  - Parity with fetch10xmeta: fetch10xmeta-parity.md
  - The graph:
      - Accession types: graph/accession-types.md
      - Routing by archive: graph/routing-by-archive.md
  - Routes:
      - The full matrix: routes/index.md
