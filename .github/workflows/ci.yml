name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false  # the survey corpora are not needed to lint or unit-test

      # An exact version: setup-uv stopped publishing floating major tags at v8.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts hooks

      - name: Format
        run: uv run ruff format --check src tests hooks

      - name: Type check
        run: uv run mypy

      # Offline only. Tests marked `integration` (live archive APIs) and
      # `pathology` (known archive bugs) are excluded by the default addopts --
      # CI must not depend on NCBI/EBI being up, and must not spend their
      # rate limit on every push.
      - name: Unit tests
        run: uv run pytest

      # CLAUDE.md claims the docs build --strict, and every route page is
      # reachable from a `kb_page` the test suite enforces the existence of.
      # Neither claim was actually checked here until a broken anchor got as far
      # as a push.
      - name: Knowledge base
        run: uv run mkdocs build --strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      # An NCBI API key reached this repository once already, through `api_key=`
      # in committed survey logs. fetch_series.logging_utils redacts it at write
      # time; this is the backstop that fails the build if one slips through.
      - name: Reject credentials in tracked files
        run: |
          # 20+ alphanumerics with no separators: the shape of a real key or
          # token. Placeholders like `api_key=NCBI_API_KEY` or `api_key=api_key`
          # carry underscores or are too short, so they do not match.
          if git grep -nIE '(api_key|apikey|access_token|password)=[A-Za-z0-9]{20,}' \
               -- ':!*.lock' ':!.github/workflows/*' ':!tests/*'; then
            echo "::error::A credential-shaped query parameter is present in a tracked file."
            exit 1
          fi
          echo "No credentials found in tracked files."

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: docker/setup-buildx-action@v4

      # The image's entry point has been broken twice in ways that were
      # invisible at build time: a venv copied to a path its shebangs did not
      # name, and an editable install pointing at a source tree the runtime
      # stage does not have. Both only failed when something actually ran
      # `fetch`. The Dockerfile now runs it as a build step, so building the
      # image here is the regression test.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: fetch-series:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The entry point runs
        run: |
          test "$(docker run --rm fetch-series:ci --version)" = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          docker run --rm fetch-series:ci routes list --implemented --ids-only | grep -q 'run->file:sdl'

      # The inspect image adds pysam and a pinned, sha256-checked sra-tools.
      # Building it is half the test; the other half is that both readers run.
      - name: Build the inspect image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.inspect
          push: false
          load: true
          tags: fetch-series-inspect:ci
          cache-from: type=gha,scope=inspect
          cache-to: type=gha,mode=max,scope=inspect

      - name: Its readers run
        run: |
          docker run --rm fetch-series-inspect:ci --version
          docker run --rm --entrypoint fastq-dump fetch-series-inspect:ci --version | grep -q 3.4.1
          docker run --rm --entrypoint python fetch-series-inspect:ci -c "import pysam; from fetch_series.inspect.readers import cram, sra; assert cram.available() and sra.available()"
          docker run --rm --user 1000:1000 --entrypoint fastq-dump fetch-series-inspect:ci --version
