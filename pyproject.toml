[project]
name = "fetch-series"
version = "0.1.0"
description = "Resolve public sequencing accessions (GEO, SRA, ENA, ArrayExpress, DDBJ) to samples, runs and file links over documented, benchmarked routes."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENCE" }
dependencies = [
    "httpx>=0.28.1",
    "httpx-retries>=0.4.6",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.0",
    "typer>=0.24.1",
]

[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]
# Batch route surveys over large accession corpora (scripts/ and fetch_series.survey).
survey = [
    "pandas>=3.0.1",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
]
notebooks = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "python-irodsclient>=3.2.0",
    { include-group = "survey" },
]

[project.scripts]
fetch = "fetch_series.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "SIM108",  # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
# Third-party stubs we do not control.
[[tool.mypy.overrides]]
module = ["httpx_retries.*", "tenacity.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Offline unit tests are the default; everything touching a live archive is opt-in.
addopts = "-v --strict-markers --tb=short -m 'not integration and not pathology and not slow'"
asyncio_mode = "auto"
markers = [
    "slow: long-running (deselect with -m 'not slow')",
    "integration: hits a live archive API; needs network",
    "pathology: asserts a *known archive bug* still reproduces. A FAILURE here means the archive fixed it — update the KB page and promote the route.",
]
